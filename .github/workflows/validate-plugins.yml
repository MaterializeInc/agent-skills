# Validates the plugin marketplace manifest and every plugin manifest.
#
# `claude plugin validate --strict` treats warnings as errors, so it catches a
# misspelled or missing field before users install the plugin. Add each new
# plugin under `plugins/` to the matrix below.
#
# This checks manifests only. Runtime behavior (LSP servers actually starting
# and answering requests) needs a real project and is verified by hand; see the
# "Claude Code Plugins" section of AGENTS.md.

name: validate-plugins

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'skills/**'
      - '.agents/skills/**'
      - '.github/workflows/validate-plugins.yml'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'skills/**'
      - '.agents/skills/**'
      - '.github/workflows/validate-plugins.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          # The repository root resolves to .claude-plugin/marketplace.json
          - .
          - ./plugins/mz-sql-lsp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate ${{ matrix.target }}
        if: matrix.target != '.'
        run: claude plugin validate "${{ matrix.target }}" --strict

      # Same as --strict, except that it allows the one warning for the
      # materialize plugin's missing version, which is deliberate (AGENTS.md).
      - name: Validate ${{ matrix.target }}, allowing the materialize plugin's missing version
        if: matrix.target == '.'
        shell: python
        run: |
          import json, subprocess, sys
          names = [p["name"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]]
          allowed = f"plugins[{names.index('materialize')}] plugin.json \u2192 version"
          result = subprocess.run(["claude", "plugin", "validate", ".", "--json"], capture_output=True, text=True)
          print(result.stdout, result.stderr, sep="\n")
          report = json.loads(result.stdout)
          failed = result.returncode != 0 or not report["success"]
          for section in [report["manifest"], *report.get("contents", [])]:
              for finding in section.get("errors", []):
                  print(f"::error::{finding['path']}: {finding['message']}")
                  failed = True
              for finding in section.get("warnings", []):
                  if finding["path"] != allowed:
                      print(f"::error::{finding['path']}: {finding['message']}")
                      failed = True
          sys.exit(1 if failed else 0)

  # The materialize plugin lists its skills in .claude-plugin/plugin.json by
  # their real directories, in skills/ and .agents/skills/. A skill added to
  # either directory but not to that list is missing for plugin users.
  materialize-plugin-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the materialize plugin lists every skill
        shell: python
        run: |
          import json, os, sys
          manifest = json.load(open(".claude-plugin/plugin.json"))
          listed = {os.path.realpath(p) for p in manifest["skills"]}
          skill_dirs = ["skills", ".agents/skills"]
          present = {os.path.realpath(os.path.join(root, d)) for root in skill_dirs for d in os.listdir(root)}
          for path in sorted(present - listed):
              print(f"::error::{os.path.relpath(path)} is missing from the materialize plugin's skills list")
          for path in sorted(listed - present):
              print(f"::error::{os.path.relpath(path)} is listed but has no entry in skills/ or .agents/skills/")
          sys.exit(1 if listed != present else 0)
